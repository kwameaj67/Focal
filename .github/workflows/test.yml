name: Run Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Scheme is Focal-Package, not Focal. Once the
      # package declared more than one library product, SwiftPM started
      # generating a scheme per product plus a combined "-Package" scheme, and
      # only the combined one carries a test action — `-scheme Focal`
      # fails with "not currently configured for the test action".
      #
      # Device name pinned to something recent enough to exist on the runner's default
      # simulator set; no OS version pinned, so it uses whatever the runner's Xcode
      # ships for that device. May need bumping to a newer device name over time as
      # Apple's simulator catalog moves on.
      - name: Run tests
        run: |
          xcodebuild test \
            -scheme Focal-Package \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -resultBundlePath ./TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
